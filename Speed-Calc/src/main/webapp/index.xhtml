<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html">
    <h:head>
        <title>Speed/Pace Convertor</title>
    </h:head>
    <h:body>
        <h:form>
            <h:outputLabel value="Convert to Pace"/>
            <h:inputText value="#{calculatorBean.speed}"/>
            <h:commandButton value="Convert to Pace" action="#{calculatorBean.calcPace}"/>

            <h:outputLabel value="Convert to Speed"/>
            <h:inputText value="#{calculatorBean.pace}" />
            <h:commandButton value="Convert to Speed" action="#{calculatorBean.calcSpeed}"/>
        </h:form>
    </h:body>
</html>
